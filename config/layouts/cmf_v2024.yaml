# =============================================================================
#  cmf1835 :: layouts declarativos  --  Circular N 1835 CMF (Chile)
# =============================================================================
#  NORMA      : Anexos Tecnicos Circular N 1835, vigente desde 2024-12-01
#               (Circular N 2354 de 2024-07-30)
#  FUENTE     : Anexos_Tecnicos_Circular_N1835.pdf, transcrito campo a campo.
#
#  REGLAS DE FORMATO (Seccion A.4 del anexo):
#    - ASCII, registros de largo fijo, relleno con ceros a la izquierda.
#    - La "V" del PICTURE NO ocupa posicion: decimales implicitos.
#      9(13)V9(04) -> 17 caracteres, 4 decimales.
#    - Campos con signo: -9(13) -> 14 caracteres; primer caracter '-' si es
#      negativo, '+' o espacio si es positivo.
#    - El caracter ',' se interpreta como digito cero.
#    - Montos en M$ (miles de pesos), aproximados al entero superior.
#
#  ANCHO EN CARACTERES, NO EN BYTES:
#    Los archivos vienen en UTF-8 y el relleno es por caracteres. Un registro
#    con 'N' mide 970 caracteres pero 971 bytes. Cortar por bytes desplaza el
#    registro completo.
#
#  VERIFICACION DE LARGOS (suma de PICTURE vs. archivos reales):
#    B.1  -> 970 en los 3 tipos de registro    [coincide con los datos]
#    B.7  -> 587 en los 7 tipos de registro    [coincide con los datos]
#    B.14 -> 300 en los 3 tipos de registro    [sin muestra disponible]
#    B.2  -> 572 en los 3 tipos               [coincide con los datos]
#    B.3  -> 361 en los 3 tipos               [coincide con los datos]
#    B.4  -> 506 en los 3 tipos               [coincide con los datos]
#    B.5  -> 611 en los 6 tipos               [coincide con los datos]
#    B.6  -> 510 en los 3 tipos               [coincide con los datos]
#    B.8  -> 138 en los 3 tipos               [coincide con los datos]
#
#  OJO -- ESTE YAML DESCRIBE UNA SOLA GENERACION DEL LAYOUT (202412 en
#  adelante). La CMF cambio los largos en 202412: antes B.1 median 930 y
#  B.7 median 489, y no existia B.14. Los periodos 202312-202411 NO se
#  pueden leer con este archivo; el motor los detecta por largo y los deja
#  sin campos en vez de inventarlos.
#
#  Campo `prov`:
#    official : transcrito del anexo oficial.
#    verified : ademas contrastado contra registros reales del ZIP.
# =============================================================================

