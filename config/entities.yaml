# =============================================================================
#  Catalogo de entidades -- contrapartes de derivados y garantias
# =============================================================================
#  Se versiona en git: una fusion bancaria reescribe retroactivamente las
#  series historicas y hay que poder auditar cuando se aplico el cambio.
#
#  PROCEDENCIA
#    Los RUT y los LEI de este archivo NO estan escritos a mano: salen de
#    recorrer los 99.190 registros de derivados de la generacion nueva
#    (202412-202608) y quedarse con los pares (identificador, nombre) que
#    aparecen de verdad. Los 25 RUT nacionales pasan modulo 11; los 25 LEI
#    son los que informan las propias companias.
#
#  MATRIZ Y FILIAL
#    Los nodos de grupo (SANTANDER, SCOTIABANK, ITAU, ...) no llevan RUT ni
#    LEI propios: existen solo para que `group_key` consolide el riesgo. El
#    banco, su corredora de bolsa y la matriz del exterior son contrapartes
#    distintas para liquidar y la misma para medir exposicion.
#
#  LO QUE NO ESTA
#    El RUT "2-7" aparece 2 veces asociado a BARCLAYS CAPITAL. Pasa modulo 11
#    por casualidad aritmetica, pero no es un RUT: es relleno. No se agrega,
#    y esos 2 registros quedan sin resolver a proposito.
# =============================================================================
